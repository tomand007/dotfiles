unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g prefix C-s
set -g mouse on

set-option -sa terminal-overrides ",xterm*:Tc"

# Ghostty reports modified keys as CSI-u; without extkeys tmux drops the
# modifier, so Shift+Enter arrives as a plain Enter.
set-option -s extended-keys always
set-option -s extended-keys-format csi-u
set-option -sa terminal-features ",xterm*:extkeys"


set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'

# dark is gruvbox dark medium with exact hexes (#282828). The plugin otherwise
# defaults to dark256, which only approximates them from the 256-color cube.
set -g @tmux-gruvbox 'dark'

set -g @continuum-restore 'off'

run '~/dotfiles/.config/tmux/plugins/tpm/tpm'
